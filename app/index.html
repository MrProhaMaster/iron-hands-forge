<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Hands Forge — Armour customizer</title><link rel="stylesheet" href="web/configurator.css"><link rel="stylesheet" href="web/motion.css"><script type="importmap">{"imports":{"three":"/web/vendor/three.module.js","three/addons/":"/web/vendor/addons/"}}</script><link rel="stylesheet" href="web/forge-tools.css"></head>
<body><header><div><span class="eyebrow">MEDUSA SIEGE / IRON HANDS</span><h1>Iron Hands Forge</h1></div><div class="header-actions"><button id="settings-open">Resources</button><button id="share-build">Share build</button><button id="refresh-catalog">Refresh catalogue</button><button id="save-roster" class="primary">Save squad</button></div></header>
<main><aside class="roster"><h2>Space Marines</h2><div id="soldiers"></div><label class="field">Armour class<select id="body-class" disabled><option>Loading…</option></select></label><div id="catalog-info" class="quiet" aria-live="polite">Preparing catalogue</div><h2>Categories</h2><nav id="categories" aria-label="Customization categories"></nav></aside>
<section class="studio" aria-label="Model preview"><div id="stage"><div id="loading" role="status">Loading armour parts…</div></div><div class="studio-toolbar"><button id="front">Front</button><button id="back">Back</button><button id="fit">Fit model</button><button id="focus">Focus part</button><label><input type="checkbox" id="spin"> Rotate</label></div><div class="motion-row"><button id="walk-play" disabled>Walk · loading</button><button id="walk-reset" disabled>Assembly pose</button><label class="sr-label" for="motion-gait">Movement</label><select id="motion-gait"><option value="walk">Walk</option><option value="run">Run</option></select><label class="sr-label" for="walk-style">Grip</label><select id="walk-style"><option value="unarmed">Unarmed</option><option value="armed">Rifle grip</option></select><label>Speed <input id="walk-speed" type="range" min="0.5" max="2" step="0.1" value="1"><output id="walk-speed-label" aria-live="off">1×</output></label><label>Frame <input id="walk-phase" aria-label="Animation frame" type="range" min="0" max="36" step="1" value="0" disabled><output id="walk-phase-label" aria-live="off">0/36</output></label></div><div class="paint-row"><label>Armour <input type="color" id="armor-color" value="#171b22"></label><label>Metal <input type="color" id="metal-color" value="#b3bdc9"></label><label>Lenses <input type="color" id="lens-color" value="#ee291c"></label></div><div class="stage-note">Drag to rotate the model. Scroll to zoom.</div><p id="selection" aria-live="polite"></p></section>
<section class="parts-panel"><div class="parts-heading"><div><span class="eyebrow">ACTUAL GAME GEOMETRY</span><h2 id="part-heading">Helmets</h2></div><span id="part-count" class="count"></span></div><input type="search" id="part-search" placeholder="Find a variant" aria-label="Find a variant"><div id="part-grid" aria-label="Part variants"></div><p id="part-help" class="quiet"></p></section></main>
<footer><span id="status" role="status">Preview materials; final textures and emblems are the next step.</span><span>Offline armour library</span></footer><script type="module" src="web/configurator.js?v=0.3.0"></script></body></html>
